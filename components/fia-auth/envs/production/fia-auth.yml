      labels:
        app: fia-auth
    spec:
      containers:
        - name: fia-auth
          image: ghcr.io/fiaisis/fia-auth@sha256:11d557ae48192c676e7978a6f3a7beeb0ffc0d0494aa1d0a665589008d57ab07
