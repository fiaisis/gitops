      labels:
        app: fia-auth
    spec:
      containers:
        - name: fia-auth
          image: ghcr.io/fiaisis/fia-auth@sha256:e86c77a109f59a9e53a395e4bb237f734b8ebf9d6ab0feda5d9090af9ad3bef2
