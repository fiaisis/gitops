      labels:
        app: fia-auth
    spec:
      containers:
        - name: fia-auth
          image: ghcr.io/fiaisis/fia-auth@sha256:4406fd827716f96b50bd1b75009329e85b7c9bc7c23ca424c5c9bdbacedbda86
