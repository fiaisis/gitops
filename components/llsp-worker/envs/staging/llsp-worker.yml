---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llsp-worker
  namespace: fia
spec:
  template:
    spec:
      containers:
        - name: llsp-worker
          image: ghcr.io/fiaisis/llsp-worker@sha256:fe958de7679f9565ba23a480dc39aa260f1c9b652ed6f63ae489ee8330938033
          env:
            - name: API_BASE_URL
              value: http://fia-api-service.fia.svc.cluster.local:80
            - name: API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fia-api
                  key: fia_api_api_key
