---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llsp-worker
  namespace: fia
spec:
  template:
    spec:
      containers:
        - name: llsp-worker
          image: ghcr.io/fiaisis/llsp-worker@sha256:c6f6bd559038c170a4deab6717070f42ceb4a9d95c0e9f756a8f7fadc9dc2d35
          env:
            - name: API_BASE_URL
              value: http://fia-api-service.fia.svc.cluster.local:80
            - name: API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fia-api
                  key: fia_api_api_key
