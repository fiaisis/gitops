---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llsp-worker
  namespace: fia
spec:
  template:
    spec:
      containers:
        - name: llsp-worker
          image: ghcr.io/fiaisis/llsp-worker@sha256:c1af2524aba02f3f528faeed2ac09313c162cff7edca5cb152bae1c169d4c0f1
          env:
            - name: API_BASE_URL
              value: http://fia-api-service.fia.svc.cluster.local:80
            - name: API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fia-api
                  key: fia_api_api_key
