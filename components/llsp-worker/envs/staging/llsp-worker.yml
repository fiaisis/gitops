---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llsp-worker
  namespace: fia
spec:
  template:
    spec:
      containers:
        - name: llsp-worker
          image: ghcr.io/fiaisis/llsp-worker@sha256:d0d4c066865e801d6768ccb1aecc97243706e5f384afe0cf9f66f548cbd8d946
          env:
            - name: API_BASE_URL
              value: http://fia-api-service.fia.svc.cluster.local:80
            - name: API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fia-api
                  key: fia_api_api_key
