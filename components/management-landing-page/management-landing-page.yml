---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:33288707a55f8ee4b06bbb5bebfdcd122e41a41a998b2f6d167229522125f87b
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
