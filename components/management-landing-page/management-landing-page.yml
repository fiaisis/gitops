---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:368de25bca6ac7f978d8eeac39acd33ac462fd48761eb22f2bae7b27a8edcda6
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
