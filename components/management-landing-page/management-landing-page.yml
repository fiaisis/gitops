---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:827c2887c543e34ea88ba7ea3db08b0297dd548886962faeb87a88c8825cad89
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
