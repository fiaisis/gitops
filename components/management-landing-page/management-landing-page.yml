---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:8da94993f1f733db086e8b40d6f26106c55f1d0290140119be24e0a339841a0d
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
