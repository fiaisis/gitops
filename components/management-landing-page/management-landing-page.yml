---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:d83281b4f62f603c3d004ab5a3f955dbfa1295b82089f98f565a77b0d0e7f3f2
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
