---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:29e64303f48d90dc4c611ac9e1d044396f9c609d85079b466dc21e15002974bc
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
