---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:79458b768fd6585f8cca95db93c6a3f685d6f83fca32db7838d3e87db835818a
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
