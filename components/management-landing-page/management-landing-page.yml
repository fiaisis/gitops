---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:355469d4575609f28f4c17744594d3c2d8a79ef288d8dc67d3b992b3046188bb
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
