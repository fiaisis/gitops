---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:79860ca03984c810392cffc5e6f35f80cbd4176f6ef3ccc5fc4bf802c3015160
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
