---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:af98f23048b0428652dc87e5d34114b05ee0e38c980defef72850af28575769b
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
