---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:cf2fb58f17ed05436a542651a59d084f5b6b5507708af6e18f9a0c2ade4bc90e
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
