---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:d58bdd8740ed7a297770cd0f39676f040aa1d875d38997b0cf0e23501a523835
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
