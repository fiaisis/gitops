---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:ed158896e2d993e58094a0943c5a046032faa452ca831101002c8203b503cf24
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
