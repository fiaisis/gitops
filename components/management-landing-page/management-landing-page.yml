---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:ab9561d7d6fc81a44adf97b194a660632cdc9bd03a47bc12d227a405ecbff33c
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
