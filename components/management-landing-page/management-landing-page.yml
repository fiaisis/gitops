---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-landing-page
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-landing-page
  template:
    metadata:
      labels:
        app: management-landing-page
    spec:
      containers:
        - name: management-landing-page
          image: ghcr.io/fiaisis/management-landing-page@sha256:5d847850d4ec21acbcc4de50cc4e62c7f51bb285f695b957bea3227cb43d472e
          ports:
            - name: web-port
              protocol: TCP
              containerPort: 3000
