---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mantid-python-script-lsp
  namespace: fia
  labels:
    app: mantid-python-script-lsp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mantid-python-script-lsp
  template:
    metadata:
      labels:
        app: mantid-python-script-lsp
    spec:
      containers:
        - name: mantid-python-script-lsp
          image: ghcr.io/fiaisis/mantid-python-script-lsp@sha256:c83f2b01f2113c5010a4c1e207ee4dab645ee681c61c46406dfed113d03704e8
          env:
            - name: MAX_SCRIPT_BYTES
              value: "200000"
            - name: DIAGNOSTIC_LIMIT
              value: "100"
          ports:
            - name: http-port
              protocol: TCP
              containerPort: 80
          startupProbe:
            httpGet:
              path: /ready
              port: 80
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
